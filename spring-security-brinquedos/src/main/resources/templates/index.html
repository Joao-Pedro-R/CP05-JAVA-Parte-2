<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja de Brinquedos Esportivos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #4facfe, #00f2fe);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 30px;
            background: rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
        }

        main {
            margin-top: 50px;
        }

        a.button {
            background-color: white;
            color: #007acc;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a.button:hover {
            background-color: #007acc;
            color: white;
        }

        footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
<header>
    <h1>🏀 Loja de Brinquedos Esportivos</h1>
    <p>Divirta-se com os melhores brinquedos esportivos para crianças até 12 anos!</p>
</header>

<main>
    <p>Bem-vindo(a)! Faça login ou crie uma conta para acessar a loja.</p>
    <br>
    <a href="/login" class="button">Fazer Login</a>
    <a href="/cadastro" class="button">Cadastrar-se</a>
</main>

<footer>
    <p>© 2025 FIAP - Checkpoint 5 | TDS</p>
</footer>
</body>
</html>
